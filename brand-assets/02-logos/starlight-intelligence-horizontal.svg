<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120" fill="none">
  <!-- Horizontal lockup - premium for headers, wide use -->
  <!-- Icon -->
  <g transform="translate(30,20)">
    <!-- Orb -->
    <circle cx="40" cy="40" r="38" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="40" cy="40" r="22" stroke="#67e8f9" stroke-width="2"/>
    <!-- Inner swarm particles -->
    <circle cx="30" cy="30" r="3" fill="#c5a46e"/>
    <circle cx="52" cy="35" r="2.5" fill="#e879f9"/>
    <circle cx="45" cy="52" r="2" fill="#67e8f9"/>
    <!-- Connecting lines for swarm -->
    <line x1="33" y1="33" x2="49" y2="37" stroke="#a78bfa" stroke-width="1" opacity="0.7"/>
    <line x1="49" y1="37" x2="47" y2="50" stroke="#67e8f9" stroke-width="1" opacity="0.7"/>
  </g>
  <!-- Wordmark -->
  <text x="130" y="55" font-family="Georgia, 'Playfair Display', serif" font-size="42" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Starlight</text>
  <text x="130" y="88" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="500" fill="#c5a46e" letter-spacing="1.5">INTELLIGENCE</text>
  <!-- Subtle SIP line -->
  <line x1="130" y1="100" x2="380" y2="100" stroke="#67e8f9" stroke-width="1" opacity="0.4"/>
  <text x="385" y="103" font-family="JetBrains Mono, monospace" font-size="10" fill="#a78bfa">BUILT ON SIP</text>
</svg>
