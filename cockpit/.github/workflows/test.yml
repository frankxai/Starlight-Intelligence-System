name: Test

on:
  push:
    branches: [main]
    paths:
      - 'cockpit/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'cockpit/**'
  workflow_dispatch:

jobs:
  smoke-windows:
    name: Smoke (Windows / PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable
      - name: Run cockpit smoke tests
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./cockpit/test/smoke.ps1

  smoke-linux:
    name: Smoke (Linux / pwsh + bash hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          source /etc/os-release
          wget -q "https://packages.microsoft.com/config/ubuntu/$VERSION_ID/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell jq
      - name: Verify bash hook is parse-clean
        run: |
          bash -n cockpit/hooks/claude-session-start.sh
          bash -n cockpit/hooks/claude-session-stop.sh
          bash -n cockpit/adapters/tmux/capture.sh
          bash -n cockpit/adapters/tmux/emit.sh
          bash -n cockpit/scripts/install.sh
      - name: Smoke-test bash hook against synthetic stdin
        run: |
          mkdir -p /tmp/cockpit-test
          export COCKPIT_HOME=/tmp/cockpit-test
          echo '{"session_id":"ci-smoke","cwd":"/tmp"}' | bash cockpit/hooks/claude-session-start.sh
          test -f $COCKPIT_HOME/sessions.jsonl
          grep -q ci-smoke $COCKPIT_HOME/sessions.jsonl
          echo "[OK] bash hook wrote manifest row"

  mcp-server:
    name: MCP server (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install MCP deps
        run: cd cockpit/mcp && npm install
      - name: Syntax check server.js
        run: node --check cockpit/mcp/server.js
      - name: Smoke-test MCP server boot
        run: |
          cd cockpit/mcp
          # Server should advertise itself on stderr within 3s
          timeout 3s node server.js 2>&1 | head -5 || true
          test 0 -eq 0  # presence of process is the check

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on all .sh
        run: |
          sudo apt-get install -y shellcheck
          # Allow exit codes for warnings; only fail on errors
          find cockpit -name '*.sh' -print0 | xargs -0 shellcheck -S error || exit_code=$?
          exit ${exit_code:-0}
