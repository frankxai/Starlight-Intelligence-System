# Grouped monthly 2026-10-19 (Week 43 inflow throttle).
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  labels:
  - dependencies
  - ci
  - supply-chain
  commit-message:
    prefix: chore(ci)
    include: scope
  open-pull-requests-limit: 3
  groups:
    gha-actions:
      patterns:
      - "*"
- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
  labels:
  - dependencies
  - supply-chain
  commit-message:
    prefix: chore(deps)
    include: scope
  open-pull-requests-limit: 3
  ignore:
  - dependency-name: ajv
  - dependency-name: semver
  - dependency-name: yaml
  - dependency-name: fast-xml-parser
  - dependency-name: '@types/node'
    update-types:
    - "version-update:semver-major"
  - dependency-name: typescript
    update-types:
    - "version-update:semver-major"
  groups:
    npm-root-minor-patch:
      update-types:
      - minor
      - patch
