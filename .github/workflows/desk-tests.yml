# The Desk (site/ /desk): unit tests and type check on Node 20 and 22.
#
# test:desk mocks every provider call and needs no secrets. The token meter's
# Lua scripts also run against a real Redis in a service container
# (run-limit.redis.test.mjs), so their EVAL semantics are tested, not mocked. It transpiles TypeScript through the site's
# own typescript devDependency (site/scripts/test/ts-resolve-hooks.mjs), which
# is what lets it run on Node 20, where --experimental-strip-types does not
# exist. This workflow deploys nothing.

name: Desk tests

on:
  pull_request:
    paths:
      - "site/src/lib/desk/**"
      - "site/src/app/api/desk/**"
      - "site/src/app/desk/**"
      - "site/scripts/test/**"
      - "site/package.json"
      - "site/package-lock.json"
      - ".github/workflows/desk-tests.yml"
  push:
    branches: [main]
    paths:
      - "site/src/lib/desk/**"
      - "site/src/app/api/desk/**"
      - "site/src/app/desk/**"
      - "site/scripts/test/**"
      - "site/package.json"
      - "site/package-lock.json"
      - ".github/workflows/desk-tests.yml"

permissions:
  contents: read

concurrency:
  group: desk-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DESK_TEST_REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      # site/package-lock.json is the lockfile Dependabot keeps current.
      # site/pnpm-lock.yaml on main is behind site/package.json (it has no
      # overrides block), so a frozen pnpm install stops before any test runs.
      - run: npm ci --no-audit --no-fund
      - run: npm run test:desk
      - run: npm run test:vault-fetch
      - run: npx tsc --noEmit
