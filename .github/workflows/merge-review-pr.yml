name: Native pull request review check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  group: native-merge-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  independent-review-policy:
    name: independent-review-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute only the immutable trusted base, never PR source or instructions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Evaluate exact source with trusted base code
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(python tools/merge-review/merge_review_gate.py)
          printf '%s\n' "$result"
          python -c 'import json,os,sys; r=json.load(sys.stdin); sys.exit(0 if r.get("passed") is True and r.get("head")==os.environ["EXPECTED_HEAD"] else 1)' <<< "$result"
