name: Review event relay

# Exists only so that a review being submitted, edited or dismissed starts the
# default-branch "Merge review policy" workflow through workflow_run. It holds no
# permissions, reads nothing and its output is never trusted: the policy workflow
# re-reads every fact from the API. If a PR edits this copy, the 30-minute sweep and
# dispatch still re-evaluate.

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Review event on PR ${{ github.event.pull_request.number }}; policy re-evaluates via workflow_run."
