name: Fleet ingress contracts
on:
  pull_request:
    paths:
      - 'tools/fleet-ingress/**'
      - 'tools/runner/runner-entrypoint.sh'
      - '.github/workflows/fleet-ingress.yml'
  push:
    branches: [main]
    paths:
      - 'tools/fleet-ingress/**'
      - 'tools/runner/runner-entrypoint.sh'
      - '.github/workflows/fleet-ingress.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: bash -n tools/runner/runner-entrypoint.sh
      - run: node --experimental-strip-types --test tools/fleet-ingress/tests/*.test.mjs
