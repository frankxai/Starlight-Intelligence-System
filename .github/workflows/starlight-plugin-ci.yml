name: Starlight plugin CI

on:
  pull_request:
    paths:
      - "plugins/starlight-intelligence/**"
      - "site/src/app/connect/**"
      - "scripts/build-connect-catalog.mjs"
      - ".github/workflows/starlight-plugin-ci.yml"
  push:
    branches: [main]
    paths:
      - "plugins/starlight-intelligence/**"
      - "site/src/app/connect/**"
      - "scripts/build-connect-catalog.mjs"
      - ".github/workflows/starlight-plugin-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/starlight-intelligence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/starlight-intelligence/package-lock.json
      - name: Verify generated connect catalog
        working-directory: .
        run: node scripts/build-connect-catalog.mjs --check
      - run: npm ci
      - run: npm run validate
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke:worker
