name: AgentDB recall correctness

on:
  pull_request:
    branches: [main]
    paths:
      - "phase0/agentdb_substrate.py"
      - "phase0/sovereign_substrate.py"
      - "phase0/agentdb_smoke.py"
      - "phase0/test_agentdb_substrate.py"
      - ".github/workflows/agentdb-recall.yml"
  push:
    branches: [main]
    paths:
      - "phase0/agentdb_substrate.py"
      - "phase0/sovereign_substrate.py"
      - "phase0/agentdb_smoke.py"
      - "phase0/test_agentdb_substrate.py"
      - ".github/workflows/agentdb-recall.yml"

permissions:
  contents: read

concurrency:
  group: agentdb-recall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recall:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Check recall, isolation and recovery
        run: python -m unittest discover -s phase0 -p test_agentdb_substrate.py -v
      - name: Run existing adapter smoke
        env:
          PYTHONIOENCODING: utf-8
        run: python phase0/agentdb_smoke.py
