# Knowledge Tree canon gate.
#
# Makes the Laws (verticals/knowledge-tree/LAWS.md) enforceable in CI rather
# than advisory: every PR that touches the canon graph or its validator runs
# the zero-dependency validator, which checks schema structure, ontology
# closure, ID grammar, prefix→domain integrity, no dangling edges, and the
# provenance / quest-lattice Laws. Fast (no npm install) and independent of the
# heavier harness-check job.
#
# Built on SIP — Starlight Intelligence Protocol
# Layers used: [file-contract, attestation]

name: Knowledge Tree canon

on:
  pull_request:
    branches: [main]
    paths:
      - "verticals/knowledge-tree/data/**"
      - ".github/workflows/knowledge-tree-canon.yml"
  push:
    branches: [main]
    paths:
      - "verticals/knowledge-tree/data/**"
      - ".github/workflows/knowledge-tree-canon.yml"

permissions:
  contents: read

concurrency:
  group: kt-canon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-canon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Validate canon (schema + Laws)
        run: node verticals/knowledge-tree/data/validate.mjs
