# `starlight <name>` dispatch to installed starlight-<name> commands.
# Does not edit package.json (foundry RULES_LOCK). Runs the dedicated test file on Linux and Windows,
# because the Windows path resolves npm .cmd shims without a shell.
name: Extensions gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/extensions.ts"
      - "src/cli.ts"
      - "test/extensions.test.ts"
      - ".github/workflows/extensions-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/extensions.ts"
      - "src/cli.ts"
      - "test/extensions.test.ts"
      - ".github/workflows/extensions-gate.yml"

permissions:
  contents: read

concurrency:
  group: extensions-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extensions-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm install --global pnpm@11.5.0
          pnpm install --frozen-lockfile

      - name: Extension dispatch tests
        run: node --import tsx --test test/extensions.test.ts
