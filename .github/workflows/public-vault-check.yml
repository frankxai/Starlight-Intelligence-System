# Public vault + template shape. No npm install — files are the product.
name: Public vault check

on:
  pull_request:
    paths:
      - "vault-registry.json"
      - "public-vault/**"
      - "templates/public-vault/**"
      - "scripts/validate-public-vault.mjs"
      - "scripts/validate-public-vault.test.mjs"
  push:
    branches: [main]
    paths:
      - "vault-registry.json"
      - "public-vault/**"
      - "templates/public-vault/**"
      - "scripts/validate-public-vault.mjs"
      - "scripts/validate-public-vault.test.mjs"

permissions:
  contents: read

concurrency:
  group: public-vault-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Unit tests
        run: node --test scripts/validate-public-vault.test.mjs

      - name: Validate registry and template
        run: node scripts/validate-public-vault.mjs
