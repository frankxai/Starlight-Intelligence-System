# Public vault + template shape. No npm install — files are the product.
name: Public vault check

on:
  pull_request:
    paths:
      - "vault-registry.json"
      - "public-vault/**"
      - "templates/public-vault/**"
      - "scripts/validate-public-vault.mjs"
      - "scripts/validate-public-vault.test.mjs"
  push:
    branches: [main]
    paths:
      - "vault-registry.json"
      - "public-vault/**"
      - "templates/public-vault/**"
      - "scripts/validate-public-vault.mjs"
      - "scripts/validate-public-vault.test.mjs"

permissions:
  contents: read

concurrency:
  group: public-vault-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Unit tests
        run: node --test scripts/validate-public-vault.test.mjs

      - name: Validate registry and template
        run: node scripts/validate-public-vault.mjs
