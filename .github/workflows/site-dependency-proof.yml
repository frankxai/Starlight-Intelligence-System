name: Site dependency candidate proof

on:
  push:
    branches: [agent/codex/sis-mcp-dependency-security-20261011]
    paths: [.github/workflows/site-dependency-proof.yml]

permissions:
  contents: read

# Temporary diagnostic for the independently reviewed Dependabot candidate.
# This workflow supplies evidence; it is not a required review check or a release.
jobs:
  candidate:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 43570fedc74d5699c05477967337a4dd8fbf0e48
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.28.0
      - name: Install the frozen candidate
        run: pnpm install --frozen-lockfile
      - name: Verify source bytes and native Sharp rendering
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const { createRequire } = require('node:module');
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(head, '43570fedc74d5699c05477967337a4dd8fbf0e48');
          const expected = {
            'package.json': '8908bc42b40ddc3456fe971712e4671db656026b277fcfaf6598071852a0f93c',
            'pnpm-lock.yaml': '53c8c87615c3bffa8c4ad93e9bf08a5e9c539b27ceb390611d361c16fb41c1cf'
          };
          for (const [path, digest] of Object.entries(expected)) {
            assert.equal(crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex'), digest);
          }
          const fromNext = createRequire(require.resolve('next/package.json'));
          const sharp = fromNext('sharp');
          const sharpVersion = sharp.versions.sharp;
          assert.equal(sharpVersion, '0.35.5');
          const rsvg = /^(\d+)\.(\d+)\.(\d+)$/.exec(sharp.versions.rsvg);
          assert(rsvg, 'Native librsvg version must be reported');
          const [major, minor, patch] = rsvg.slice(1).map(Number);
          assert(major > 2 || (major === 2 && (minor > 63 || (minor === 63 && patch >= 2))),
            'Native librsvg must include the 2.63.2 security fix');
          (async () => {
            const svg = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32"><rect width="64" height="32" fill="#2468ac"/></svg>');
            const { data, info } = await sharp(svg).resize(32, 16).png().toBuffer({ resolveWithObject: true });
            assert.equal(info.width, 32);
            assert.equal(info.height, 16);
            assert.equal(info.format, 'png');
            assert.deepEqual([...data.subarray(0, 8)], [137, 80, 78, 71, 13, 10, 26, 10]);
            const report = { head, platform: process.platform, arch: process.arch, node: process.version,
              sourceDigests: expected, frozenInstall: true, sharp: sharpVersion, nativeVersions: sharp.versions,
              render: { format: info.format, width: info.width, height: info.height, bytes: data.length,
                sha256: crypto.createHash('sha256').update(data).digest('hex') } };
            fs.writeFileSync('site-native-proof.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - run: pnpm run build
      - run: pnpm exec tsc --noEmit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-native-proof-${{ matrix.os }}-${{ github.run_id }}
          path: site/site-native-proof.json
          if-no-files-found: error
          retention-days: 7
