name: Site image dependency checks

on:
  pull_request:
    branches: [main]
    paths:
      - site/package.json
      - site/pnpm-lock.yaml
      - site/pnpm-workspace.yaml
      - site/scripts/check-image-dependency.mjs
      - site/scripts/should-deploy.sh
      - site/scripts/should-deploy.test.mjs
      - .github/workflows/site-dependency-proof.yml
  push:
    branches: [main]
    paths:
      - site/package.json
      - site/pnpm-lock.yaml
      - site/pnpm-workspace.yaml
      - site/scripts/check-image-dependency.mjs
      - site/scripts/should-deploy.sh
      - site/scripts/should-deploy.test.mjs
      - .github/workflows/site-dependency-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-image-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-dependencies:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the site's pinned package manager
        run: npm install --global pnpm@10.33.0
      - name: Install the exact site dependency graph
        run: pnpm install --frozen-lockfile
      - name: Exercise the native image library selected by Next
        run: node --test scripts/check-image-dependency.mjs
      - name: Verify build input changes trigger a deployment
        if: runner.os == 'Linux'
        run: node --test scripts/should-deploy.test.mjs
      - name: Check for known production dependency advisories
        run: pnpm audit --prod --audit-level high
