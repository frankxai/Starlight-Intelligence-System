name: Creative director proof
on:
  pull_request:
    paths:
      - 'examples/creative-director/**'
      - '.github/workflows/creative-director-proof.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: creative-director-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  draft-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm run test:creative-draft
      - run: node examples/creative-director/plan.mjs --workflow examples/creative-director/creator-workflow.json --output "${{ runner.temp }}/creator-plan.json"
  visual-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Capture existing public references before web implementation
        run: node examples/creative-director/capture-reference.mjs --out creative-reference-proof
        env:
          CHROME_BIN: google-chrome
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: creative-reference-proof
          path: creative-reference-proof
          retention-days: 14
