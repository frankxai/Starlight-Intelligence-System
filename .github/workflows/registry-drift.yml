# npm registry drift check.
#
# `npm publish` for @arcanea/starlight-intelligence-system is a manual step
# today, and the registry has gone two majors stale before without anyone
# noticing. This workflow compares the published version to package.json's
# version daily and files a GitHub issue on mismatch — it never publishes.
# release.yml (triggered by `git tag v*`) is the only path that publishes.
#
# `npm view` fails if the package has never been published (404) or on a
# registry hiccup; this workflow treats that as a reportable condition, not a
# run failure, and says so in the issue body.
#
# Built on SIP — Starlight Intelligence Protocol
# Layers used: [file-contract, attestation]

name: Registry drift check

on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: registry-drift-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Compare package.json version to npm registry
        id: compare
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          if REGISTRY_VERSION="$(npm view @arcanea/starlight-intelligence-system version 2>npm-view.err)"; then
            echo "registry_version=$REGISTRY_VERSION" >> "$GITHUB_OUTPUT"
            echo "npm_view_failed=false" >> "$GITHUB_OUTPUT"
            if [ "$PKG_VERSION" = "$REGISTRY_VERSION" ]; then
              echo "drift=false" >> "$GITHUB_OUTPUT"
            else
              echo "drift=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "registry_version=" >> "$GITHUB_OUTPUT"
            echo "npm_view_failed=true" >> "$GITHUB_OUTPUT"
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::npm view failed — package may be unpublished. See npm-view.err."
            cat npm-view.err || true
          fi

      - name: Open or update drift issue
        if: steps.compare.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_VERSION: ${{ steps.compare.outputs.pkg_version }}
          REGISTRY_VERSION: ${{ steps.compare.outputs.registry_version }}
          NPM_VIEW_FAILED: ${{ steps.compare.outputs.npm_view_failed }}
        run: |
          TITLE="npm registry drift"

          if [ "$NPM_VIEW_FAILED" = "true" ]; then
            {
              echo "\`npm view @arcanea/starlight-intelligence-system version\` failed — the package may be unpublished, or the registry lookup errored. This is not necessarily a problem (npm publish is manual; release.yml only runs on a \`v*\` tag), but it means registry-drift-check.yml cannot currently verify the published version."
              echo ""
              echo "- package.json version: \`${PKG_VERSION}\`"
              echo "- npm registry version: (lookup failed)"
              echo ""
              echo "Run \`npm view @arcanea/starlight-intelligence-system version\` locally to confirm. Publish via \`git tag v${PKG_VERSION} && git push origin v${PKG_VERSION}\` (release.yml) once NPM_TOKEN is set."
              echo ""
              echo "Built on SIP — Starlight Intelligence Protocol."
            } > /tmp/issue-body.md
          else
            {
              echo "package.json (\`${PKG_VERSION}\`) and the published npm registry version (\`${REGISTRY_VERSION}\`) have drifted."
              echo ""
              echo "- package.json version: \`${PKG_VERSION}\`"
              echo "- npm registry version: \`${REGISTRY_VERSION}\`"
              echo ""
              echo "To publish the current version: \`git tag v${PKG_VERSION} && git push origin v${PKG_VERSION}\` (release.yml, gated on the \`NPM_TOKEN\` secret)."
              echo ""
              echo "Built on SIP — Starlight Intelligence Protocol."
            } > /tmp/issue-body.md
          fi

          EXISTING=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
          fi
