name: Merge review policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, auto_merge_enabled, auto_merge_disabled, edited]
  issue_comment:
    types: [created, edited, deleted]
  # Review submit or dismiss events reach this default-branch workflow through the
  # no-permission relay; a pull_request_review trigger here would run the PR's copy.
  workflow_run:
    workflows: [Review event relay]
    types: [completed]
  # Fallback re-evaluation of the most recently updated open PRs (see docs/merge-review.md).
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to evaluate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  group: merge-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This is trusted default-branch code. Never check out or execute PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Evaluate source paths and review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        # Checker identity and independent reviewers come from the CODEOWNED
        # tools/merge-review/checker-trust.json on the default branch, never a variable.
        run: python -I tools/merge-review/merge_review_gate.py
