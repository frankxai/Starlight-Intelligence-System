name: Context continuity

on:
  pull_request:
    branches: [main, codex/consolidate]
    paths:
      - 'src/context-bridge.ts'
      - 'src/review-queue.ts'
      - 'src/gateway/**'
      - 'src/runtime-bridge/**'
      - 'src/sanitization.ts'
      - 'test/context*.test.ts'
      - 'test/review-queue.test.ts'
      - 'test/gateway-lock-safety.test.ts'
      - 'test/v89-session-store.test.ts'
      - 'test/v90-gateway*.test.ts'
      - 'test/runtime-bridge.test.ts'
      - 'test/jev-router.test.ts'
      - 'tools/poly-bridge.mjs'
      - 'package*.json'
      - '.github/workflows/context-continuity.yml'
  push:
    branches: [main, codex/consolidate]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    name: Context continuity / ${{ matrix.os }}
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Verify handoff, review, privacy and recovery
        run: node --import tsx --test --test-concurrency=1 test/context-bridge.test.ts test/context-continuity.test.ts test/review-queue.test.ts test/gateway-lock-safety.test.ts test/v89-session-store.test.ts test/v90-gateway.test.ts test/v90-gateway-privacy.test.ts test/runtime-bridge.test.ts test/opencode-runtime.test.ts test/terminal-runtime.test.ts test/jev-router.test.ts
