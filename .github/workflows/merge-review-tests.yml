name: Merge review gate tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/merge-review.yml
      - .github/workflows/merge-review-tests.yml
      - tools/merge-review/**
      - tools/jules-conductor/**
      - tools/runner/inspect-cloud-run*
  push:
    branches: [main]
    paths:
      - .github/workflows/merge-review.yml
      - .github/workflows/merge-review-tests.yml
      - tools/merge-review/**
      - tools/jules-conductor/**
      - tools/runner/inspect-cloud-run*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-review-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-review-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify receipt acceptance and denial
        run: python -m unittest discover -s tools/merge-review/tests -p 'test_*.py' -v
      - name: Verify conductor retirement, review gates and cloud preflight
        run: node --test tools/jules-conductor/tests/*.test.mjs tools/runner/inspect-cloud-run.test.mjs
