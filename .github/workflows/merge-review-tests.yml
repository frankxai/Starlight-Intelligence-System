name: Review boundary tests

on:
  pull_request:
    paths:
      - '.github/workflows/merge-review*.yml'
      - 'tools/merge-review/**'
      - 'docs/merge-review.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-review*.yml'
      - 'tools/merge-review/**'
      - 'docs/merge-review.md'

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/merge-review/tests -v
