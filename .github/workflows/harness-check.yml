# Harness + counts drift guard.
#
# The README advertises `npm run agents:harness-check` as the way prompt
# surfaces "stay aligned with reality." This workflow makes that promise
# enforceable: doc/version/count drift fails a PR here instead of reaching a
# contributor's first command. Also runs lint, build, and the test suite so the
# self-consistency surface (test/v80-platform-prompts.test.ts +
# test/harness-self-check.test.ts) is gated on every change.
#
# The `web` job closes a cloud-autonomy gap: CI never used to build site/ or
# console/, so a breaking Next.js change only surfaced on manual `pnpm build`
# or, worse, at Vercel deploy time. It runs in parallel with `harness` since
# the two surfaces are independent.
#
# Built on SIP — Starlight Intelligence Protocol
# Layers used: [file-contract, attestation]

name: Harness check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Agent-harness drift guard
        run: npm run agents:harness-check

      - name: Agent profile conformance
        run: node scripts/validate-agents.mjs

      - name: Tests
        run: npm test

  web:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: pnpm run build

      - name: Install console dependencies
        working-directory: console
        run: pnpm install --frozen-lockfile

      - name: Build console
        working-directory: console
        run: pnpm run build
