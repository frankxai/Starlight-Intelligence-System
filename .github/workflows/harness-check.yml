# Harness + counts drift guard.
#
# The README advertises `npm run agents:harness-check` as the way prompt
# surfaces "stay aligned with reality." This workflow makes that promise
# enforceable: doc/version/count drift fails a PR here instead of reaching a
# contributor's first command. Also runs lint, build, and the test suite so the
# self-consistency surface (test/v80-platform-prompts.test.ts +
# test/harness-self-check.test.ts) is gated on every change.
#
# Built on SIP — Starlight Intelligence Protocol
# Layers used: [file-contract, attestation]

name: Harness check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Agent-harness drift guard
        run: npm run agents:harness-check

      # Only this repo is checked out here, so the mesh can re-measure SIS and
      # nothing else; every other repo's numbers are carried forward verbatim.
      # That still catches the failures that matter on a PR: a hand-edited
      # generated mesh, a curated entry that no longer regenerates, and SIS's
      # own counts drifting. Portfolio-wide refresh happens on a machine with
      # the whole portfolio checked out (npm run mesh:generate).
      - name: Portfolio-mesh drift guard
        run: npm run mesh:check

      - name: Tests
        run: npm test
