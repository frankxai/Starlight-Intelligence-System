name: Community contracts
on:
  pull_request:
    paths:
      - 'src/community.ts'
      - 'test/community.test.ts'
      - 'plugins/starlight-community/**'
      - '.github/workflows/community-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/community.ts'
      - 'test/community.test.ts'
      - 'plugins/starlight-community/**'
      - '.github/workflows/community-contract.yml'
permissions:
  contents: read
jobs:
  weekly-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test test/community.test.ts
