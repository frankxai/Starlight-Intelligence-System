# npm publish on tag.
#
# `npm publish` for @arcanea/starlight-intelligence-system was a manual step
# — the registry has gone two majors stale before because of it. This
# workflow makes publishing a `git tag v*.*.* && git push origin v*.*.*` away,
# gated on the same build+test:substrate bar as prepublishOnly.
#
# Dormant-until-secret, mirroring vercel-deploy.yml's preflight pattern: with
# no NPM_TOKEN secret set, `publish` is skipped cleanly and a ::notice::
# points at the manual fallback instead of the run failing red.
#
# Built on SIP — Starlight Intelligence Protocol
# Layers used: [file-contract, attestation]

name: Release to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has-secret: ${{ steps.check.outputs.has }}
    steps:
      - name: Check NPM_TOKEN presence
        id: check
        env:
          T: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$T" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN unset — publish skipped. Set it with 'gh secret set NPM_TOKEN'. Manual publish: npm ci && npm run build && npm run test:substrate && npm publish --access public"
          fi

  publish:
    needs: preflight
    if: needs.preflight.outputs.has-secret == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "Tag $tag does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Substrate tests
        run: npm run test:substrate

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
