[package]
name = "starlight-invariants"
version = "0.2.0"
edition = "2021"
description = "Deterministic Layer-0 Kernel: AST Invariants, Infinite Vault Mesh, Virtual MCP Router & Concurrency Arbiter"
license = "MIT OR Apache-2.0"
authors = ["Frank Riemer <frank@arcanea.ai>", "Starlight Intelligence System Contributors"]

[[bin]]
name = "starlight"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.20"
tree-sitter-typescript = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
petgraph = "0.6"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive", "cargo"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "macros"] }
