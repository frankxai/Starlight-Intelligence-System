<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Starlight Intelligence System architecture: JSONL vaults flow through a rebuildable SQLite FTS5 index and temporal, contradiction and dreaming engines into an MCP server exposing ten sis tools, fanned out to every coding agent.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <marker id="ar"  markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#3b4252"/></marker>
    <marker id="arT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7fffd4"/></marker>
  </defs>

  <rect width="920" height="460" rx="14" fill="url(#bg)"/>
  <text x="40" y="46" fill="#e6edf3" font-size="22" font-weight="700">Starlight Intelligence System</text>
  <text x="40" y="68" fill="#7d8590" font-size="13">One governed, attested memory substrate — shared by every coding agent you run.</text>

  <!-- 1. Vaults -->
  <g>
    <rect x="40" y="104" width="220" height="120" rx="12" fill="#11161f" stroke="#1f6f5c" stroke-width="1.5"/>
    <text x="56" y="130" fill="#7fffd4" font-size="13" font-weight="700">6 SEMANTIC VAULTS</text>
    <text x="56" y="150" fill="#9aa4b2" font-size="11">source of truth · JSONL</text>
    <text x="56" y="172" fill="#cdd9e5" font-size="11">◆ strategic   ⬡ technical</text>
    <text x="56" y="190" fill="#cdd9e5" font-size="11">✦ creative    ▸ operational</text>
    <text x="56" y="208" fill="#cdd9e5" font-size="11">◎ wisdom      ↗ horizon</text>
  </g>

  <!-- 2. Index + engines -->
  <g>
    <rect x="330" y="92" width="230" height="144" rx="12" fill="#11161f" stroke="#3a4a7a" stroke-width="1.5"/>
    <text x="346" y="118" fill="#78a6ff" font-size="13" font-weight="700">REBUILDABLE INDEX + ENGINES</text>
    <text x="346" y="140" fill="#cdd9e5" font-size="11">SQLite FTS5 · bm25 ranking</text>
    <line x1="346" y1="150" x2="544" y2="150" stroke="#222a36"/>
    <text x="346" y="170" fill="#9aa4b2" font-size="11">⏱ temporal — 90-day half-life</text>
    <text x="346" y="190" fill="#9aa4b2" font-size="11">⚠ contradiction — cross-vault</text>
    <text x="346" y="210" fill="#9aa4b2" font-size="11">✶ dreaming — consolidation</text>
    <text x="346" y="228" fill="#9aa4b2" font-size="11">⛬ sanitization gateway</text>
  </g>

  <!-- 3. MCP -->
  <g>
    <rect x="630" y="104" width="250" height="120" rx="12" fill="#11161f" stroke="#7a5aa6" stroke-width="1.5"/>
    <text x="646" y="130" fill="#c084fc" font-size="13" font-weight="700">MCP SERVER</text>
    <text x="646" y="150" fill="#9aa4b2" font-size="11">JSON-RPC 2.0 over stdio</text>
    <text x="646" y="174" fill="#cdd9e5" font-size="11">10 sis_* tools — search, append,</text>
    <text x="646" y="192" fill="#cdd9e5" font-size="11">recent, stats, confirm, invalidate,</text>
    <text x="646" y="210" fill="#cdd9e5" font-size="11">contradict, stale, entry_types…</text>
  </g>

  <!-- flows -->
  <line x1="260" y1="164" x2="330" y2="164" stroke="#3b4252" stroke-width="2" marker-end="url(#ar)"/>
  <text x="266" y="156" fill="#7d8590" font-size="10">rebuild</text>
  <line x1="560" y1="164" x2="630" y2="164" stroke="#3b4252" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4. agents fan-out -->
  <g>
    <rect x="40" y="296" width="840" height="96" rx="12" fill="#0e131b" stroke="#222a36" stroke-width="1.5"/>
    <text x="56" y="320" fill="#ffd700" font-size="13" font-weight="700">EVERY CODING AGENT — same substrate, every session</text>
    <g fill="#cdd9e5" font-size="12">
      <rect x="56"  y="336" width="150" height="40" rx="8" fill="#131a24" stroke="#2b3442"/><text x="131" y="361" text-anchor="middle">Claude Code</text>
      <rect x="220" y="336" width="150" height="40" rx="8" fill="#131a24" stroke="#2b3442"/><text x="295" y="361" text-anchor="middle">Cursor</text>
      <rect x="384" y="336" width="150" height="40" rx="8" fill="#131a24" stroke="#2b3442"/><text x="459" y="361" text-anchor="middle">Codex</text>
      <rect x="548" y="336" width="150" height="40" rx="8" fill="#131a24" stroke="#2b3442"/><text x="623" y="361" text-anchor="middle">Gemini CLI</text>
      <rect x="712" y="336" width="150" height="40" rx="8" fill="#131a24" stroke="#2b3442"/><text x="787" y="361" text-anchor="middle">OpenCode</text>
    </g>
  </g>

  <!-- MCP -> agents -->
  <line x1="755" y1="224" x2="755" y2="296" stroke="#7a5aa6" stroke-width="2" marker-end="url(#ar)"/>
  <!-- feedback loop agents -> vaults -->
  <path d="M150 296 C150 260 150 250 150 224" fill="none" stroke="#7fffd4" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arT)"/>
  <text x="158" y="262" fill="#7fffd4" font-size="10">writes back — memory compounds</text>

  <text x="40" y="430" fill="#7d8590" font-size="11">Built on SIP — the Starlight Intelligence Protocol. JSONL is canon; the index, engines, and MCP layer are rebuildable on top of it.</text>
</svg>
