name = "starlight-cloud-worker"
main = "src/index.ts"
compatibility_date = "2026-10-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"
DEFAULT_HALF_LIFE_DAYS = "90"
API_VERSION = "v1"

[[vectorize]]
binding = "STARLIGHT_VECTORS"
index_name = "starlight-memories-768"

[[d1_databases]]
binding = "STARLIGHT_DB"
database_name = "starlight-production-db"
database_id = "175513dc-1a47-4ba3-961f-78c54603af16"

[[kv_namespaces]]
binding = "STARLIGHT_KV"
id = "5dab9ccc89a04a6a964fd3bc7ef12288"

[durable_objects]
bindings = [
  { name = "SWARM_COORDINATOR", class_name = "SwarmCoordinator" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SwarmCoordinator"]

[ai]
binding = "AI"

