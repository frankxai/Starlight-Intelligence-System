# portfolio-mesh.yaml — machine-readable registry of registries
# Canonical cross-repo manifest for the FrankX / Starlight portfolio.
# Patterned on mind-intelligence-systems/repo-mesh.yaml, extended portfolio-wide.
# Verified by file enumeration 2026-07-25 (system-wide upgrade audit).
# Rule: counts here are ground truth until the next audit stamps a newer date.
#       If a repo's own README/CLAUDE.md disagrees, the repo doc is stale — fix the repo doc.

version: 0.1.0
last_verified: "2026-07-25"
maintainer: Starlight-Intelligence-System/context/empire/

repos:
