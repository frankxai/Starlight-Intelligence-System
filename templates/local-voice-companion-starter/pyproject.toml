[project]
name = "starlight-local-voice-companion"
version = "0.1.0"
description = "Starlight Local Voice Companion Starter - Desktop Tauri + Python Pipecat runtime"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.12"
dependencies = [
  "pipecat-ai>=1.4.0,<2.0.0",
  "pyaudio>=0.2.14",
  "websockets>=12.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
local = [
  "faster-whisper>=1.1.0",
  "kokoro-onnx>=0.5.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
